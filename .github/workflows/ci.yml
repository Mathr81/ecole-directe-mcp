name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # `typecheck` runs before `build` deliberately: it is what actually
      # type-checks test/ and scripts/ (tsconfig.test.json). `build` only
      # compiles src/, so without this step the types the fixtures and the
      # adapter derive from @blockshub/blocksdirecte would never be
      # re-checked in CI.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
